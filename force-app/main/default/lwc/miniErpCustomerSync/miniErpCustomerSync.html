
<template>
    <lightning-card title="MiniERP Customer Sync">
        <div class="slds-p-around_medium">
            <lightning-input
                label="MiniERP Customer ID"
                type="number"
                value={customerId}
                onchange={handleCustomerIdChange}>
            </lightning-input>

            <lightning-button
                label="Sync Customer"
                variant="brand"
                onclick={handleSync}
                class="slds-m-top_medium">
            </lightning-button>

            <template lwc:if={message}>
                <p class="slds-m-top_medium">{message}</p>
            </template>
        </div>
    </lightning-card>
</template>
